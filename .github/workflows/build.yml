name: Build Amiberry Host Tools

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container: sacredbanana/amiga-compiler:m68k-amigaos

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6.0.2

    - name: Build tools
      run: make all

    - name: Run tests
      run: make test

    - name: Package tools
      run: |
        if [ "${{ github.ref_type }}" = "tag" ]; then
          VERSION="${{ github.ref_name }}"
        else
          VERSION="latest"
        fi
        make package PACKAGE="Host-Tools-${VERSION}.lha"

    - name: Upload Artifacts
      uses: actions/upload-artifact@v7.0.1
      with:
        name: host-tools-package
        path: "*.lha"

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          name: host-tools-package

      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create ${{ github.ref_name }} *.lha --title "Host-Tools ${{ github.ref_name }}" --generate-notes
